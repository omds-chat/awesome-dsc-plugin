name: build-and-deploy

# 分发模型:来源只有插件作者自己的 Pages 站点,每个 Release 全量重建 pages 包并直接替换,不做版本留存。
# 本流程不再把分发包提交回仓库,因此只需要读源码的权限;额外的 issues 写权限只用于异常上报。
on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # 异常上报要写 Issue:构建剔除的插件会追加到追踪 Issue,失败不影响发布
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

# 私钥只有两个来源:
#   secrets.EEC_SECRET_KEY  终端签名证书私钥(ECDSA P-256),只在本流程内存与临时目录中出现;
#   secrets.ROOT_CA_PEM     根证书 PEM,用于校验证书链与全部 CMS 签名,不是私钥。
# 根证书私钥属于 DeepSeek-Chat-Enhanced 仓库的离线环境,绝不出现在本流程。
# 合集证书的固定位置是 certs/awesome-dsc-plugin-eec.crt;pages 根目录不放 eec.pem。
env:
  EEC_SECRET_KEY: ${{ secrets.EEC_SECRET_KEY }}
  EEC_CERT_PEM: ${{ secrets.EEC_CERT_PEM }}
  ROOT_CA_PEM: ${{ secrets.ROOT_CA_PEM }}
  ROOT_CA_URL: ${{ vars.ROOT_CA_URL }}
  SITE_DIR: ${{ vars.SITE_DIR }}
  PUBLISHED_BASE_URL: ${{ vars.PUBLISHED_BASE_URL }}

jobs:
  build:
    name: Build pages package
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check OpenSSL
        run: openssl version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 根证书二选一,优先级从高到低:
      #   1. secrets.ROOT_CA_PEM  根证书 PEM 文本,适合不便公开拉取的场景;
      #   2. vars.ROOT_CA_URL     根证书下载地址。
      - name: Resolve root CA
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/root_ca.crt"
          if [ -n "${ROOT_CA_PEM:-}" ]; then
            printf '%s\n' "$ROOT_CA_PEM" > "$target"
            echo "根证书来源: secrets.ROOT_CA_PEM"
          elif [ -n "${ROOT_CA_URL:-}" ]; then
            curl -fsSL "$ROOT_CA_URL" -o "$target"
            echo "根证书来源: $ROOT_CA_URL"
          else
            echo "::error::缺少根证书,请设置 secrets.ROOT_CA_PEM 或 vars.ROOT_CA_URL"
            exit 1
          fi
          echo "ROOT_CA_PATH=$target" >> "$GITHUB_ENV"

      # 证书与私钥都从 secrets 注入:私钥只在签名时使用;
      # 证书默认用 main 分支的 certs/awesome-dsc-plugin-eec.crt,提供 secrets.EEC_CERT_PEM 时以 secret 为准。
      - name: Install EEC certificate
        run: |
          set -euo pipefail
          target="certs/awesome-dsc-plugin-eec.crt"
          if [ -n "${EEC_CERT_PEM:-}" ]; then
            printf '%s\n' "$EEC_CERT_PEM" > "$target"
            echo "终端签名证书来源: secrets.EEC_CERT_PEM"
          else
            echo "终端签名证书来源: $target"
          fi
          test -s "$target"

      # 强校验: 合集证书必须由该根证书签发,且未过期、
      # keyUsage 含 digitalSignature、basicConstraints 为 CA:FALSE。
      - name: Verify EEC against root CA
        run: |
          set -euo pipefail
          eec="certs/awesome-dsc-plugin-eec.crt"
          openssl verify -CAfile "$ROOT_CA_PATH" "$eec"
          openssl x509 -in "$eec" -noout -subject -issuer -enddate
          openssl x509 -in "$eec" -noout -ext keyUsage
          openssl x509 -in "$eec" -noout -ext basicConstraints
          openssl x509 -in "$eec" -noout -checkend 0

      # 源码树自检:catalog 登记之外的结构问题在这里就暴露,不必等到打包之后。
      - name: Verify repository
        run: node scripts/verify-collection.mjs --dir . --allow-placeholder-eec

      # site 构建产物放到 pages 根目录。站点没有自带构建时,直接用 vars.SITE_DIR 指向的静态产物。
      - name: Build site
        run: |
          set -euo pipefail
          site_dir="${SITE_DIR:-site/dist}"
          if [ -f site/package.json ]; then
            pnpm --dir site install --frozen-lockfile
            pnpm --dir site build
          fi
          test -f "$site_dir/index.html"
          echo "SITE_OUT=$site_dir" >> "$GITHUB_ENV"

      # 按 catalog 从各插件的 base_url 拉取版本,重新签名 plugin.js,生成三层清单并组装 pages 包。
      # pages 根目录的 L1 revision 从已发布站点的 manifest.json 读取上一次的值再加一,取不到时从 1 开始。
      - name: Pull plugins and assemble pages
        run: |
          set -euo pipefail
          published="${PUBLISHED_BASE_URL:-https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/}"
          node scripts/build-from-catalog.mjs \
            --catalog catalog \
            --certs certs \
            --site "$SITE_OUT" \
            --out dist/pages \
            --root-ca "$ROOT_CA_PATH" \
            --published-base "$published" \
            --release-tag "${GITHUB_REF_NAME:-unknown}"

      # 交叉校验:catalog/index.json、datalog.json、作者清单、catalog 副本与 plugins 树的收录信息必须一致。
      # 任何不一致都以非零退出码失败并列出差异,避免索引与产物各说各话。
      - name: Verify catalog consistency
        run: node scripts/verify-catalog-consistency.mjs --dir dist/pages

      # 不经过 Node 脚本,直接用 openssl 独立验签三层清单与每个 plugin.js,避免脚本与 openssl 语义分叉。
      - name: Verify manifests and plugin signatures with openssl
        run: |
          set -euo pipefail
          eec="dist/pages/certs/awesome-dsc-plugin-eec.crt"
          test -f "$eec"
          manifests=0
          while IFS= read -r manifest; do
            sig="$manifest.sig"
            if [ ! -f "$sig" ]; then
              echo "::error::缺少清单签名 $sig"
              exit 1
            fi
            openssl cms -verify -binary -md sha512 -inform DER \
              -in "$sig" -content "$manifest" \
              -CAfile "$ROOT_CA_PATH" -certfile "$eec" > /dev/null
            manifests=$((manifests + 1))
          done < <(find dist/pages -type f -name manifest.json | sort)
          plugins=0
          while IFS= read -r plugin; do
            sig="$plugin.sig"
            if [ ! -f "$sig" ]; then
              echo "::error::缺少 plugin.js 签名 $sig"
              exit 1
            fi
            openssl cms -verify -binary -md sha512 -inform DER \
              -in "$sig" -content "$plugin" \
              -CAfile "$ROOT_CA_PATH" -certfile "$eec" > /dev/null
            plugins=$((plugins + 1))
          done < <(find dist/pages/plugins -type f -name plugin.js | sort)
          echo "已验签 $manifests 层清单,$plugins 份 plugin.js"
          if [ "$manifests" -lt 1 ]; then
            echo "::error::pages 包里没有任何清单"
            exit 1
          fi

      # 结构自检:pages 根目录不放 eec.pem,catalog 与 certs 必须在,plugins 树按作者与插件分层。
      - name: Check pages layout
        run: |
          set -euo pipefail
          shopt -s nullglob
          test -f dist/pages/index.html
          test -d dist/pages/assets
          test -f dist/pages/meta.json
          test -f dist/pages/tags.json
          test -f dist/pages/datalog.json
          test -f dist/pages/manifest.json
          test -f dist/pages/manifest.json.sig
          test -d dist/pages/catalog
          test -f dist/pages/catalog/index.json
          test -f dist/pages/catalog/anomalies.json
          test -f dist/pages/catalog/removed.json
          test -d dist/pages/certs
          test -f dist/pages/certs/awesome-dsc-plugin-eec.crt
          if [ -e dist/pages/eec.pem ]; then
            echo "::error::pages 根目录不得包含 eec.pem,合集证书只在 certs/awesome-dsc-plugin-eec.crt"
            exit 1
          fi
          test -f dist/pages/plugins/author_manifest.json
          for author_manifest in dist/pages/plugins/*/plugin_manifest.json; do
            author_dir=$(dirname "$author_manifest")
            test -f "$author_dir/author_pub.pem"
            test -f "$author_dir/manifest.json"
            test -f "$author_dir/manifest.json.sig"
            for versions in "$author_dir"/*/versions.json; do
              plugin_dir=$(dirname "$versions")
              test -f "$plugin_dir/manifest.json"
              test -f "$plugin_dir/manifest.json.sig"
              for meta in "$plugin_dir"/*/meta.json; do
                version_dir=$(dirname "$meta")
                test -f "$version_dir/plugin.js"
                test -f "$version_dir/plugin.js.sig"
              done
            done
          done
          echo "pages 结构检查通过"

      - name: Verify pages package
        run: node scripts/verify-collection.mjs --dir dist/pages --root-ca "$ROOT_CA_PATH"

      # 异常上报:只写本仓库 Issue,不进发布产物。
      # 脚本自己吞掉全部失败并以 0 退出,再加一道 continue-on-error,确保上报问题不阻塞发布。
      - name: Report excluded plugins
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/report-build-anomalies.mjs \
            --anomalies dist/pages/catalog/anomalies.json \
            --repo "${{ github.repository }}" \
            --tag "${{ github.ref_name }}"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    name: Deploy Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
